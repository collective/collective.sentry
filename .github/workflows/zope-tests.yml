name: Extra tests

on:
  push:
  workflow_dispatch:

jobs:
  extra-tests:
    strategy:
      # We want to see all failures:
      fail-fast: false
      matrix:
        config:
        - ["3.13", "zope integration", "zope"]
        - ["3.13", "sentry_sdk 2.x integration", "sentry2.x"]
    runs-on: ubuntu-latest
    name: ${{ matrix.config[1] }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv + caching
      uses: plone/meta/.github/actions/setup_uv@2.x
      with:
        python-version: ${{ matrix.config[0] }}
    - name: Test
      run: uvx --with tox-uv tox -e ${{ matrix.config[2] }}
