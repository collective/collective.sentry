# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[github]
jobs = [
   "qa",
   "dependencies",
   "release_ready",
   "circular",
]

[pyproject]
check_manifest_ignores = """
    "PLAN-*.md",
    "SPEC-*.md",
"""

[tox]
test_matrix = {"6.2" = ["*"]}
test_environment_variables = """
    SENTRY_DISABLE=1
"""
envlist_lines = """
    zope
"""
extra_lines = """
[testenv:zope]
description = unit tests against plain Zope, without Plone installed
use_develop = true
skip_install = false
extras =
set_env = SENTRY_DISABLE=1
deps =
    zope.testrunner
    Products.SiteErrorLog
commands =
    zope-testrunner --test-path={toxinidir}/src -s collective.sentry -m 'collective\\.sentry\\.tests\\.(test_extraction|test_capture|test_integration|test_bootstrap|test_bbb)' {posargs}
"""
